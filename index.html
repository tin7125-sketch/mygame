<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多媒體互動搶答系統</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.95);
      --accent-pink: #ff6b9d;
      --accent-blue: #4a90e2;
      --accent-yellow: #f5a623;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --text-main: #ffffff;
      --border-color: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: background 0.5s ease;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; position: relative; padding-bottom: 80px; }

    /* 🖥️ 電腦／OBS 錄影：主遊戲區放大並以 16:9 畫面比例為基準 */
    @media (min-width: 900px) {
      body { padding: 20px; }
      .container { max-width: 1920px; }
      #game-panel { width: 100%; min-height: min(56.25vw, 1080px); }
    }

    /* 📱 手機：取消錄影版尺寸限制，維持原本響應式操作 */
    @media (max-width: 899px) {
      #game-panel { width: 100%; min-height: auto; }
    }
    .card { background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); text-align: center; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .title { font-size: 26px; font-weight: bold; margin-bottom: 15px; color: var(--accent-pink); }
    
    .btn { background: var(--accent-blue); border: none; color: white; padding: 10px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 4px; font-weight: bold; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-danger { background: var(--accent-red); }
    .btn-success { background: var(--accent-green); }
    .btn-warning { background: var(--accent-yellow); color: #111; }
    
    .scores { display: flex; justify-content: space-around; font-size: 22px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
    .q-progress { color: var(--accent-yellow); font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .question-text { font-size: 24px; font-weight: bold; margin: 10px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    /* 影片/圖片大畫面區 */
    .media-box { width: 100%; height: 360px; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin: 12px 0; overflow: hidden; border: 1px solid var(--border-color); }
    .media-box img, .media-box video { width: 100%; height: 100%; object-fit: contain; }

    /* 可點擊選項清單 */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
    .option-item { 
      background: rgba(255,255,255,0.08); 
      padding: 14px; 
      border-radius: 10px; 
      border: 2px solid var(--border-color); 
      text-align: left; 
      font-size: 18px; 
      font-weight: bold; 
      transition: 0.2s; 
    }


    /* 👑 主持人專屬：直接顯示在主畫面上的題庫與即時修改面板 */
    .host-direct-panel {
      background: rgba(245, 166, 35, 0.1);
      border: 2px dashed var(--accent-yellow);
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
      display: none;
    }
    .host-direct-title { font-size: 16px; font-weight: bold; color: var(--accent-yellow); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .collapse-btn { background: #444; color: #fff; border: none; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 11px; }
.answer-reveal { font-size: 24px; font-weight: bold; color: var(--accent-green); margin: 8px 0; min-height: 34px; }
.sound-buttons { display:flex; gap:4px; margin-top:4px; }
.sound-buttons .btn { flex:1; }
    .form-input-sm { width: 100%; padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; margin-bottom: 6px; user-select: text; }
    .form-label { font-size: 11px; color: #ccc; display: block; margin-top: 4px; }

    /* 👑 右下角主持快捷控制台 */
    .host-floating-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(15, 17, 23, 0.95);
      border: 2px solid var(--accent-yellow);
      border-radius: 12px;
      padding: 12px;
      width: 280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      display: none;
    }
    .host-floating-header { font-weight: bold; color: var(--accent-yellow); margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; font-size: 13px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- 1. 角色選擇頁面 -->
    <div id="role-select" class="card">
      <div class="title">🎮 多媒體互動搶答系統</div>
      <button class="btn btn-warning" onclick="selectRole('host')">👑 我是 主持人</button>
      <button class="btn" onclick="selectRole('p1')">🙋‍♂️ 我是 玩家一 (P1)</button>
      <button class="btn" onclick="selectRole('p2')">🙋‍♀️ 我是 玩家二 (P2)</button>
    </div>

    <!-- 2. 主遊戲畫面 -->
    <div id="game-panel" class="card" style="display: none;">
      <div id="role-display" style="color: #aaa; font-size: 14px; margin-bottom: 8px;"></div>
      
      <!-- 積分板 -->
      <div class="scores">
        <div>
          <div style="font-size:13px;color:#aaa;">🏆 積分板</div>
          <span id="name-p1">玩家一</span>：
          <span id="score-p1" style="color:var(--accent-pink)">0</span>
        </div>
        <div>
          <div style="font-size:13px;color:#aaa;">本題分值</div>
          <span id="q-score-top" style="color:var(--accent-yellow);font-size:28px;">10</span> 分
        </div>
        <div>
          <div style="font-size:13px;color:#aaa;">🏆 積分板</div>
          <span id="name-p2">玩家二</span>：
          <span id="score-p2" style="color:var(--accent-blue)">0</span>
        </div>
      </div>

      <!-- 題目與價值 -->
      <div style="margin-top: 15px;">
        <div class="q-progress">
          <span id="q-number">題目載入中...</span>
          <span style="color: var(--accent-green); margin-left: 10px;">[ 本題價值：<span id="q-score-display">10</span> 分 ]</span>
        </div>
        <div class="question-text" id="q-title">--</div>
          <div id="answer-reveal" class="answer-reveal"></div>
      </div>

      <!-- 高畫質多媒體區域 -->
      <div class="media-box" id="media-container"></div>

      <!-- 選項清單區 -->
      <div class="options-grid" id="options-container"></div>

      <!-- 👑 【主持人專屬】直接顯示在主畫面上的題庫與題目編輯管理面板 -->
      <div id="host-direct-panel" class="host-direct-panel">
        <div class="host-direct-title">
          <span>🛠️ 主持人設定與題庫管理</span>
          <button id="collapse-host-btn" class="collapse-btn" onclick="toggleHostPanel()">收起 ▲</button>
        </div>

        <div id="host-panel-content">
        <div style="background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; margin-bottom: 8px; border: 1px dashed var(--accent-yellow);">
          <label class="form-label" style="color:var(--accent-yellow); font-weight:bold;">👤 玩家名稱（由主持人設定）</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <input type="text" id="player-name-p1" class="form-input-sm" placeholder="玩家一名稱">
            <input type="text" id="player-name-p2" class="form-input-sm" placeholder="玩家二名稱">
          </div>
          <button class="btn btn-warning" style="width:100%; padding:6px; font-size:12px;" onclick="savePlayerNames()">💾 儲存玩家名稱</button>
        </div>

        <div style="margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 6px;">
          <label class="form-label" style="color:var(--accent-yellow);">快速選擇跳到某題：</label>
          <select id="direct-q-select" class="form-input-sm" onchange="jumpToQuestion(this.value)"></select>
        </div>

        <div style="margin-bottom: 8px;">
          <div class="host-direct-title" style="font-size:13px; margin-bottom:5px;">
            <span>題庫操作</span>
            <div>
              <button class="btn btn-success" style="padding:4px 10px; font-size:11px;" onclick="addNewQuestion()">➕ 新增一題</button>
              <button class="btn btn-danger" style="padding:4px 10px; font-size:11px;" onclick="deleteCurrentQuestion()">🗑️ 刪除本題</button>
            </div>
          </div>
        </div>

        <label class="form-label">修改題目文字：</label>
        <input type="text" id="edit-title" class="form-input-sm">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">上傳題目照片/影片：</label>
            <input type="file" id="edit-media-file" class="form-input-sm" accept="image/*,video/*">
          </div>
          <div>
            <label class="form-label">或貼上題目媒體網址：</label>
            <input type="text" id="edit-media-url" class="form-input-sm" placeholder="https://...">
          </div>
        </div>

        <!-- 🌟 自動背景設定區塊 -->
        <div style="background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; margin: 6px 0; border: 1px dashed var(--accent-blue);">
          <label class="form-label" style="color: var(--accent-blue); font-weight: bold;">🖼️ 自動更換背景圖片設定：</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
            <div>
              <label class="form-label">上傳背景圖片檔案：</label>
              <input type="file" id="edit-bg-file" class="form-input-sm" accept="image/*">
            </div>
            <div>
              <label class="form-label">或貼上背景圖片網址：</label>
              <input type="text" id="edit-bg-url" class="form-input-sm" placeholder="https://...">
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">選項 A：</label>
            <input type="text" id="edit-opt-0" class="form-input-sm">
            <label class="form-label">選項 B：</label>
            <input type="text" id="edit-opt-1" class="form-input-sm">
          </div>
          <div>
            <label class="form-label">選項 C：</label>
            <input type="text" id="edit-opt-2" class="form-input-sm">
            <label class="form-label">選項 D：</label>
            <input type="text" id="edit-opt-3" class="form-input-sm">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">正確答案 (A/B/C/D)：</label>
            <select id="edit-answer" class="form-input-sm">
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>
          <div>
            <label class="form-label">本題配分：</label>
            <input type="number" id="edit-score" class="form-input-sm">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">答對音效網址：</label>
            <input type="text" id="edit-sound-correct" class="form-input-sm" placeholder="https://...">
          </div>
          <div>
            <label class="form-label">答錯音效網址：</label>
            <input type="text" id="edit-sound-wrong" class="form-input-sm" placeholder="https://...">
          </div>
        </div>

        <button class="btn btn-success" style="width:100%; margin-top:8px; font-size:13px;" onclick="applyTempEdit()">🚀 即時儲存並同步更新全場 (含背景)</button>
        </div>
      </div>

    </div>
  </div>

  <!-- 3. 👑 右下角主持快捷控制台 -->
  <div id="host-floating" class="host-floating-panel">
    <div class="host-floating-header">🎛️ 主持快捷控制列</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; gap: 4px;">
        <button class="btn btn-warning" style="flex:1; padding:6px; font-size:12px;" onclick="prevQuestion()">⬅️ 上題</button>
        <button class="btn btn-warning" style="flex:1; padding:6px; font-size:12px;" onclick="nextQuestion()">下題 ➡️</button>
      </div>
      <div style="border-top:1px dashed #555; padding-top:4px;">
        <div style="color:#aaa;font-size:11px;margin-bottom:3px;">主持人自行判定，不由程式自動判定：</div>
      </div>
      <div class="sound-buttons">
        <button class="btn btn-success" style="padding:6px; font-size:12px;" onclick="playAnswerSound(true)">🔊 答對音效</button>
        <button class="btn btn-danger" style="padding:6px; font-size:12px;" onclick="playAnswerSound(false)">🔊 答錯音效</button>
      </div>
      <button class="btn btn-warning" style="width:100%; padding:7px; font-size:12px;" onclick="revealCorrectAnswer()">👁️ 公布正確答案給所有人</button>
      <div style="border-top:1px dashed #555; margin-top:6px; padding-top:6px;">
        <div style="color:var(--accent-yellow);font-size:12px;font-weight:bold;margin-bottom:4px;">📝 主持人手動計分</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;">
          <button class="btn btn-success" style="padding:6px;font-size:11px;" onclick="changeScore('p1', 1)">＋1 <span id="score-name-p1">玩家一</span></button>
          <button class="btn btn-danger" style="padding:6px;font-size:11px;" onclick="changeScore('p1', -1)">－1 <span id="score-name-p1b">玩家一</span></button>
          <button class="btn btn-success" style="padding:6px;font-size:11px;" onclick="changeScore('p2', 1)">＋1 <span id="score-name-p2">玩家二</span></button>
          <button class="btn btn-danger" style="padding:6px;font-size:11px;" onclick="changeScore('p2', -1)">－1 <span id="score-name-p2b">玩家二</span></button>
        </div>
        <div style="display:flex;gap:4px;margin-top:4px;">
          <input id="manual-score-amount" type="number" value="10" min="1" class="form-input-sm" style="margin:0;flex:1;" />
          <button class="btn btn-success" style="padding:6px;font-size:11px;" onclick="changeScoreWithAmount('p1', 1)">P1 加</button>
          <button class="btn btn-danger" style="padding:6px;font-size:11px;" onclick="changeScoreWithAmount('p1', -1)">P1 減</button>
          <button class="btn btn-success" style="padding:6px;font-size:11px;" onclick="changeScoreWithAmount('p2', 1)">P2 加</button>
          <button class="btn btn-danger" style="padding:6px;font-size:11px;" onclick="changeScoreWithAmount('p2', -1)">P2 減</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ================= 1. 預設題庫 =================
    let defaultQuestions = [
      {
        id: 1,
        title: "請問這隻可愛的狗是什麼品種？",
        media: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800",
        bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200",
        options: ["A. 柴犬", "B. 柯基", "C. 哈士奇", "D. 貴賓狗"],
        answer: "A",
        score: 10,
        soundCorrect: "https://actions.google.com/sounds/v1/cartoon/clown_horn.ogg",
        soundWrong: "https://actions.google.com/sounds/v1/cartoon/boing.ogg"
      },
      {
        id: 2,
        title: "請問短片中的風景是哪一個國家？",
        media: "https://www.w3schools.com/html/mov_bbb.mp4",
        bg: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200",
        options: ["A. 日本", "B. 美國", "C. 瑞士", "D. 紐西蘭"],
        answer: "C",
        score: 20,
        soundCorrect: "https://actions.google.com/sounds/v1/cheering/applause.ogg",
        soundWrong: "https://actions.google.com/sounds/v1/fights/hit_01.ogg"
      }
    ];

    // ================= 2. Firebase 初始化 =================
    const firebaseConfig = {
      apiKey: "AIzaSyC3ogiRnUkzdvHLQvZABgfDtTmacyzX6nw",
      authDomain: "my-game-d36e6.firebaseapp.com",
      databaseURL: "https://my-game-d36e6-default-rtdb.firebaseio.com",
      projectId: "my-game-d36e6",
      storageBucket: "my-game-d36e6.firebasestorage.app",
      messagingSenderId: "1042585493952",
      appId: "1:1042585493952:web:f5927600bc64b0f77b2825",
      measurementId: "G-2FRXMEDR08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myRole = '';
    let countdownTimer = null;

    function selectRole(role) {
      myRole = role;
      db.ref('gameState').once('value').then(snapshot => {
        if (!snapshot.exists()) {
          return db.ref('gameState').set({
            questionsList: defaultQuestions,
            currentQIndex: 0,
            p1Score: 0,
            p2Score: 0,
            playerNames: { p1: '玩家一', p2: '玩家二' },
            answerRevealed: false
          });
        }
      }).catch(err => console.error('Firebase 初始化失敗：', err));
      document.getElementById('role-select').style.display = 'none';
      document.getElementById('game-panel').style.display = 'block';

      if (role === 'host') {
        document.getElementById('role-display').innerText = "當前身份：👑 主持人控制台";
        document.getElementById('host-direct-panel').style.display = 'block';
        document.getElementById('host-floating').style.display = 'block';
      } else {
        document.getElementById('role-display').innerText = `當前身份：${role === 'p1' ? '🙋‍♂️ 玩家一 (P1)' : '🙋‍♀️ 玩家二 (P2)'}`;
        document.getElementById('player-controls').style.display = 'block';
      }

      listenToDatabase();
    }

    function updateHostDropdown(totalCount, currentIdx) {
      const dropdown = document.getElementById('direct-q-select');
      if (!dropdown) return;
      dropdown.innerHTML = '';
      for (let i = 0; i < totalCount; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `第 ${i + 1} 題`;
        if (i === currentIdx) opt.selected = true;
        dropdown.appendChild(opt);
      }
    }

    // ================= 3. 即時資料監聽與畫面同步 =================
    function listenToDatabase() {
      db.ref('gameState').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        
        if (data.questionsList && Array.isArray(data.questionsList)) {
          defaultQuestions = data.questionsList;
        }

        document.getElementById('score-p1').innerText = data.p1Score || 0;
        document.getElementById('score-p2').innerText = data.p2Score || 0;

        const p1Name = data.playerNames && data.playerNames.p1 ? data.playerNames.p1 : '玩家一';
        const p2Name = data.playerNames && data.playerNames.p2 ? data.playerNames.p2 : '玩家二';
        document.getElementById('name-p1').innerText = p1Name;
        document.getElementById('name-p2').innerText = p2Name;
        const scoreNameP1 = document.getElementById('score-name-p1');
        const scoreNameP1b = document.getElementById('score-name-p1b');
        const scoreNameP2 = document.getElementById('score-name-p2');
        const scoreNameP2b = document.getElementById('score-name-p2b');
        if (scoreNameP1) scoreNameP1.innerText = p1Name;
        if (scoreNameP1b) scoreNameP1b.innerText = p1Name;
        if (scoreNameP2) scoreNameP2.innerText = p2Name;
        if (scoreNameP2b) scoreNameP2b.innerText = p2Name;

        if (myRole === 'host') {
          document.getElementById('player-name-p1').value = p1Name;
          document.getElementById('player-name-p2').value = p2Name;
        }

        const qIndex = data.currentQIndex || 0;
        const currentQ = defaultQuestions[qIndex] || defaultQuestions[0] || {
          title: "請新增題目", media: "", bg: "", options: ["A", "B", "C", "D"], answer: "A", score: 10
        };

        updateHostDropdown(defaultQuestions.length, qIndex);

        document.getElementById('q-score-display').innerText = currentQ.score || 0;
        document.getElementById('q-score-top').innerText = currentQ.score || 0;
        document.getElementById('q-number').innerText = `第 ${qIndex + 1} / ${defaultQuestions.length} 題`;
        document.getElementById('q-title').innerText = currentQ.title;

        // 自動更換背景圖片
        if (currentQ.bg) {
          document.body.style.backgroundImage = `url('${currentQ.bg}')`;
        } else {
          document.body.style.backgroundImage = 'none';
        }

        // 如果是主持人，自動把當前題目帶入修改表單
        if (myRole === 'host') {
          document.getElementById('edit-title').value = currentQ.title || '';
          document.getElementById('edit-score').value = currentQ.score || 10;
          document.getElementById('edit-media-url').value = currentQ.media || '';
          document.getElementById('edit-bg-url').value = currentQ.bg || '';
          document.getElementById('edit-answer').value = currentQ.answer || 'A';
          document.getElementById('edit-sound-correct').value = currentQ.soundCorrect || '';
          document.getElementById('edit-sound-wrong').value = currentQ.soundWrong || '';

          const opts = currentQ.options || ["", "", "", ""];
          for (let i = 0; i < 4; i++) {
            document.getElementById(`edit-opt-${i}`).value = opts[i] || '';
          }
        }

        // 渲染多媒體
        const mediaBox = document.getElementById('media-container');
        if (currentQ.media) {
          const url = currentQ.media.toLowerCase();
          if (url.startsWith('data:video') || url.endsWith('.mp4') || url.endsWith('.webm') || url.includes('video')) {
            mediaBox.innerHTML = `<video src="${currentQ.media}" controls autoplay loop muted></video>`;
          } else {
            mediaBox.innerHTML = `<img src="${currentQ.media}" alt="題目媒體">`;
          }
        } else {
          mediaBox.innerHTML = `<div style="color:#666;">無多媒體檔案</div>`;
        }

        // 渲染選項
        const optsContainer = document.getElementById('options-container');
        optsContainer.innerHTML = (currentQ.options || []).map((opt) => {
          return `<div class="option-item">${opt}</div>`;
        }).join('');

        // 主持人公布正確答案
        const answerRevealBox = document.getElementById('answer-reveal');
        if (data.answerRevealed) {
          answerRevealBox.innerText = `✅ 正確答案：${currentQ.answer || ''}`;
        } else {
          answerRevealBox.innerText = '';
        }

        // 音效播放狀態（主持人手動控制）
        if (data.lastAction === 'sound_correct') {
          if (currentQ.soundCorrect) new Audio(currentQ.soundCorrect).play().catch(() => {});
        } else if (data.lastAction === 'sound_wrong') {
          if (currentQ.soundWrong) new Audio(currentQ.soundWrong).play().catch(() => {});
        }

      });
    }

    // ================= 4. 主持人管理邏輯 =================
    // 主持人手動計分：程式不判定答對或答錯
    function changeScore(player, delta) {
      db.ref('gameState').once('value', (snapshot) => {
        const data = snapshot.val() || {};
        const key = player === 'p1' ? 'p1Score' : 'p2Score';
        const current = Number(data[key]) || 0;
        db.ref('gameState').update({
          [key]: current + delta
        });
      });
    }

    function changeScoreWithAmount(player, direction) {
      const amount = Math.max(1, Number(document.getElementById('manual-score-amount').value) || 1);
      changeScore(player, amount * direction);
    }

    function jumpToQuestion(idx) {
      db.ref('gameState').update({
        currentQIndex: parseInt(idx),
        answerRevealed: false
      });
    }

    function nextQuestion() {
      db.ref('gameState').once('value', (snapshot) => {
        const currentIdx = (snapshot.val() || {}).currentQIndex || 0;
        if (currentIdx < defaultQuestions.length - 1) jumpToQuestion(currentIdx + 1);
      });
    }

    function prevQuestion() {
      db.ref('gameState').once('value', (snapshot) => {
        const currentIdx = (snapshot.val() || {}).currentQIndex || 0;
        if (currentIdx > 0) jumpToQuestion(currentIdx - 1);
      });
    }

    function addNewQuestion() {
      const newQ = {
        title: "請輸入新題目內容",
        media: "",
        bg: "",
        options: ["A. 選項一", "B. 選項二", "C. 選項三", "D. 選項四"],
        answer: "A",
        score: 10,
        soundCorrect: "",
        soundWrong: ""
      };
      defaultQuestions.push(newQ);
      db.ref('gameState').update({
        questionsList: defaultQuestions,
        currentQIndex: defaultQuestions.length - 1,
        answerRevealed: false
      });
    }

    function deleteCurrentQuestion() {
      if (defaultQuestions.length <= 1) {
        alert("⚠️ 題庫至少需要保留一題！");
        return;
      }
      db.ref('gameState').once('value', async (snapshot) => {
        const data = snapshot.val() || {};
        let currentIdx = data.currentQIndex || 0;
        
        defaultQuestions.splice(currentIdx, 1);
        if (currentIdx >= defaultQuestions.length) {
          currentIdx = defaultQuestions.length - 1;
        }

        await db.ref('gameState').update({
          questionsList: defaultQuestions,
          currentQIndex: currentIdx,
        });
        alert("🗑️ 已刪除本題！");
      });
    }

    // 儲存並發布當前題目的修改 (包含背景)
    async function applyTempEdit() {
      db.ref('gameState').once('value', async (snapshot) => {
        const data = snapshot.val() || {};
        const qIndex = data.currentQIndex || 0;

        const title = document.getElementById('edit-title').value;
        const score = parseInt(document.getElementById('edit-score').value) || 10;
        const answer = document.getElementById('edit-answer').value;
        const soundCorrect = document.getElementById('edit-sound-correct').value;
        const soundWrong = document.getElementById('edit-sound-wrong').value;

        const options = [
          document.getElementById('edit-opt-0').value,
          document.getElementById('edit-opt-1').value,
          document.getElementById('edit-opt-2').value,
          document.getElementById('edit-opt-3').value
        ];

        let media = document.getElementById('edit-media-url').value;
        const mediaFile = document.getElementById('edit-media-file').files[0];
        if (mediaFile) {
          media = await fileToDataURL(mediaFile);
        }

        let bg = document.getElementById('edit-bg-url').value;
        const bgFile = document.getElementById('edit-bg-file').files[0];
        if (bgFile) {
          bg = await fileToDataURL(bgFile);
        }

        if (!defaultQuestions[qIndex]) defaultQuestions[qIndex] = {};
        defaultQuestions[qIndex].title = title;
        defaultQuestions[qIndex].score = score;
        defaultQuestions[qIndex].answer = answer;
        defaultQuestions[qIndex].options = options;
        defaultQuestions[qIndex].media = media;
        defaultQuestions[qIndex].bg = bg;
        defaultQuestions[qIndex].soundCorrect = soundCorrect;
        defaultQuestions[qIndex].soundWrong = soundWrong;

        db.ref('gameState').update({
          questionsList: defaultQuestions
        });

        alert("✅ 題庫與背景設定已成功儲存並同步至全場！");
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function playAnswerSound(isCorrect) {
      db.ref('gameState').once('value', (snapshot) => {
        const data = snapshot.val() || {};
        const qIndex = data.currentQIndex || 0;
        const questionList = Array.isArray(data.questionsList) ? data.questionsList : defaultQuestions;
        const currentQ = questionList[qIndex] || {};
        const soundUrl = isCorrect ? currentQ.soundCorrect : currentQ.soundWrong;

        if (soundUrl) {
          new Audio(soundUrl).play().catch(err => console.warn('音效播放失敗：', err));
        } else {
          alert(isCorrect ? '這一題沒有設定答對音效。' : '這一題沒有設定答錯音效。');
        }
      });
    }

    function revealCorrectAnswer() {
      db.ref('gameState').update({
        answerRevealed: true,
      });
    }

    function savePlayerNames() {
      const p1 = document.getElementById('player-name-p1').value.trim() || '玩家一';
      const p2 = document.getElementById('player-name-p2').value.trim() || '玩家二';
      db.ref('gameState/playerNames').set({ p1, p2 });
    }

    function toggleHostPanel() {
      const content = document.getElementById('host-panel-content');
      const btn = document.getElementById('collapse-host-btn');
      if (content.style.display === 'none') {
        content.style.display = 'block';
        btn.innerText = '收起 ▲';
      } else {
        content.style.display = 'none';
        btn.innerText = '展開 ▼';
      }
    }
  </script>
</body>
</html>
