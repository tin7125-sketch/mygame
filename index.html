<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多媒體互動搶答系統</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.95);
      --accent-pink: #ff6b9d;
      --accent-blue: #4a90e2;
      --accent-yellow: #f5a623;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --text-main: #ffffff;
      --border-color: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: background 0.5s ease;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; position: relative; padding-bottom: 80px; }
    .card { background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); text-align: center; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .title { font-size: 26px; font-weight: bold; margin-bottom: 15px; color: var(--accent-pink); }
    
    .btn { background: var(--accent-blue); border: none; color: white; padding: 10px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 4px; font-weight: bold; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-danger { background: var(--accent-red); }
    .btn-success { background: var(--accent-green); }
    .btn-warning { background: var(--accent-yellow); color: #111; }
    
    .scores { display: flex; justify-content: space-around; font-size: 22px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
    .q-progress { color: var(--accent-yellow); font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .question-text { font-size: 24px; font-weight: bold; margin: 10px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    /* 影片/圖片大畫面區 */
    .media-box { width: 100%; height: 360px; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin: 12px 0; overflow: hidden; border: 1px solid var(--border-color); }
    .media-box img, .media-box video { width: 100%; height: 100%; object-fit: contain; }

    /* 可點擊選項清單 */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
    .option-item { 
      background: rgba(255,255,255,0.08); 
      padding: 14px; 
      border-radius: 10px; 
      border: 2px solid var(--border-color); 
      text-align: left; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer;
      transition: 0.2s; 
    }
    .option-item:hover { background: rgba(255,255,255,0.18); border-color: var(--accent-blue); }
    .option-item.selected { background: var(--accent-blue); border-color: #fff; color: #fff; box-shadow: 0 0 12px rgba(74, 144, 226, 0.8); }

    .status-msg { font-size: 24px; color: var(--accent-yellow); font-weight: bold; margin: 10px 0; min-height: 36px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

    /* 搶答按鈕 */
    .btn-buzzer { width: 100%; height: 130px; font-size: 36px; font-weight: bold; background: var(--accent-pink); border-radius: 20px; box-shadow: 0 8px 0 #c0392b; cursor: pointer; color: white; border: none; }
    .btn-buzzer:active { transform: translateY(4px); box-shadow: 0 4px 0 #c0392b; }
    .btn-buzzer:disabled { background: #444; box-shadow: none; color: #888; }

    /* 👑 主持人專屬：直接顯示在畫面上的即時修改面板 (選手看不到) */
    .host-direct-panel {
      background: rgba(245, 166, 35, 0.1);
      border: 2px dashed var(--accent-yellow);
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
      display: none;
    }
    .host-direct-title { font-size: 16px; font-weight: bold; color: var(--accent-yellow); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .form-input-sm { width: 100%; padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; margin-bottom: 6px; user-select: text; }
    .form-label { font-size: 11px; color: #ccc; display: block; margin-top: 4px; }

    /* 👑 右下角主持控制面板 (只放搶答、評分與換題快捷) */
    .host-floating-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(15, 17, 23, 0.95);
      border: 2px solid var(--accent-yellow);
      border-radius: 12px;
      padding: 12px;
      width: 280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      display: none;
    }
    .host-floating-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; color: var(--accent-yellow); margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; font-size: 13px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- 1. 角色選擇頁面 -->
    <div id="role-select" class="card">
      <div class="title">🎮 多媒體互動搶答系統</div>
      <button class="btn btn-warning" onclick="selectRole('host')">👑 我是 主持人</button>
      <button class="btn" onclick="selectRole('p1')">🙋‍♂️ 我是 玩家一 (P1)</button>
      <button class="btn" onclick="selectRole('p2')">🙋‍♀️ 我是 玩家二 (P2)</button>
    </div>

    <!-- 2. 主遊戲畫面 (主持人與選手共同看見的大螢幕) -->
    <div id="game-panel" class="card" style="display: none;">
      <div id="role-display" style="color: #aaa; font-size: 14px; margin-bottom: 8px;"></div>
      
      <!-- 分數統計區 -->
      <div class="scores">
        <div>P1 得分：<span id="score-p1" style="color:var(--accent-pink)">0</span></div>
        <div>P2 得分：<span id="score-p2" style="color:var(--accent-blue)">0</span></div>
      </div>

      <!-- 題目與價值 -->
      <div style="margin-top: 15px;">
        <div class="q-progress">
          <span id="q-number">題目載入中...</span>
          <span style="color: var(--accent-green); margin-left: 10px;">[ 本題價值：<span id="q-score-display">10</span> 分 ]</span>
        </div>
        <div class="question-text" id="q-title">--</div>
      </div>

      <!-- 高畫質多媒體區域 -->
      <div class="media-box" id="media-container"></div>

      <!-- 選項清單區 -->
      <div class="options-grid" id="options-container"></div>

      <!-- 👑 【主持人專屬】直接顯示在畫面上的即時修改面板 (選手看不到) -->
      <div id="host-direct-panel" class="host-direct-panel">
        <div class="host-direct-title">🛠️ 主持人即時修改區 (此區選手看不見)</div>
        
        <label class="form-label">修改題目文字：</label>
        <input type="text" id="edit-title" class="form-input-sm">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">上傳新照片/影片檔案：</label>
            <input type="file" id="edit-media-file" class="form-input-sm" accept="image/*,video/*">
          </div>
          <div>
            <label class="form-label">或貼上媒體網址：</label>
            <input type="text" id="edit-media-url" class="form-input-sm" placeholder="https://...">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">答對音效 (檔案或網址)：</label>
            <input type="file" id="edit-correct-file" class="form-input-sm" accept="audio/*">
            <input type="text" id="edit-sound-correct" class="form-input-sm" placeholder="音效網址">
          </div>
          <div>
            <label class="form-label">答錯音效 (檔案或網址)：</label>
            <input type="file" id="edit-wrong-file" class="form-input-sm" accept="audio/*">
            <input type="text" id="edit-sound-wrong" class="form-input-sm" placeholder="音效網址">
          </div>
        </div>

        <label class="form-label">本題配分：</label>
        <input type="number" id="edit-score" class="form-input-sm" style="width: 120px;">

        <button class="btn btn-success" style="width:100%; margin-top:8px; font-size:13px;" onclick="applyTempEdit()">🚀 即時發布更新到全場畫面</button>
      </div>

      <!-- 搶答動態訊息 -->
      <div class="status-msg" id="buzzer-status">等待主持人開放搶答...</div>

      <!-- 選手搶答按鈕 -->
      <div id="player-controls" style="display: none;">
        <button id="buzzer-btn" class="btn-buzzer" onclick="pressBuzzer()" disabled>⚡ 搶 答 ⚡</button>
      </div>
    </div>
  </div>

  <!-- 3. 👑 右下角主持快捷控制台 (僅限搶答開關與判定) -->
  <div id="host-floating" class="host-floating-panel">
    <div class="host-floating-header">
      <span>⚡ 搶答與判定快捷列</span>
    </div>
    
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div>
        <label style="font-size: 11px; color: var(--accent-yellow);">快速換題：</label>
        <select id="q-select-dropdown" class="form-input-sm" onchange="jumpToQuestion(this.value)" style="margin-bottom:4px;"></select>
      </div>
      <div style="display: flex; gap: 4px;">
        <button class="btn btn-warning" style="flex:1; padding:6px; font-size:12px;" onclick="prevQuestion()">⬅️ 上題</button>
        <button class="btn btn-warning" style="flex:1; padding:6px; font-size:12px;" onclick="nextQuestion()">下題 ➡️</button>
      </div>
      <div style="display: flex; gap: 4px;">
        <button class="btn btn-success" style="flex:1; padding:6px; font-size:12px;" onclick="enableBuzzer()">⚡ 開放</button>
        <button class="btn btn-danger" style="flex:1; padding:6px; font-size:12px;" onclick="resetBuzzer()">🔄 重置</button>
      </div>
      <div style="border-top:1px dashed #555; padding-top:4px; display: flex; gap: 4px;">
        <button class="btn btn-success" style="flex:1; padding:6px; font-size:12px;" onclick="judgeAnswer(true)">⭕ 答對</button>
        <button class="btn btn-danger" style="flex:1; padding:6px; font-size:12px;" onclick="judgeAnswer(false)">❌ 答錯</button>
      </div>
    </div>
  </div>

  <script>
    // ================= 1. 預設題庫 =================
    const DEFAULT_QUESTIONS = [
      {
        id: 1,
        title: "請問這隻可愛的狗是什麼品種？",
        media: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800",
        options: ["A. 柴犬", "B. 柯基", "C. 哈士奇", "D. 貴賓狗"],
        answer: "A",
        score: 10,
        bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200",
        soundCorrect: "https://actions.google.com/sounds/v1/cartoon/clown_horn.ogg",
        soundWrong: "https://actions.google.com/sounds/v1/cartoon/boing.ogg"
      },
      {
        id: 2,
        title: "請問短片中的風景是哪一個國家？",
        media: "https://www.w3schools.com/html/mov_bbb.mp4",
        options: ["A. 日本", "B. 美國", "C. 瑞士", "D. 紐西蘭"],
        answer: "C",
        score: 20,
        bg: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200",
        soundCorrect: "https://actions.google.com/sounds/v1/cheering/applause.ogg",
        soundWrong: "https://actions.google.com/sounds/v1/fights/hit_01.ogg"
      }
    ];

    const soundBuzzer = new Audio("https://actions.google.com/sounds/v1/emergency/beeps_high.ogg");

    // ================= 2. Firebase 初始化 =================
    const firebaseConfig = {
      apiKey: "AIzaSyC3ogiRnUkzdvHLQvZABgfDtTmacyzX6nw",
      authDomain: "my-game-d36e6.firebaseapp.com",
      databaseURL: "https://my-game-d36e6-default-rtdb.firebaseio.com",
      projectId: "my-game-d36e6",
      storageBucket: "my-game-d36e6.firebasestorage.app",
      messagingSenderId: "1042585493952",
      appId: "1:1042585493952:web:f5927600bc64b0f77b2825",
      measurementId: "G-2FRXMEDR08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let myRole = '';

    function selectRole(role) {
      myRole = role;
      document.getElementById('role-select').style.display = 'none';
      document.getElementById('game-panel').style.display = 'block';

      if (role === 'host') {
        document.getElementById('role-display').innerText = "當前身份：👑 主持人控制台";
        document.getElementById('host-direct-panel').style.display = 'block'; // 顯示畫面上直覺修改區
        document.getElementById('host-floating').style.display = 'block'; // 顯示右下角快捷面板
        initHostDropdown();
      } else {
        document.getElementById('role-display').innerText = `當前身份：${role === 'p1' ? '🙋‍♂️ 玩家一 (P1)' : '🙋‍♀️ 玩家二 (P2)'}`;
        document.getElementById('player-controls').style.display = 'block';
      }

      listenToDatabase();
    }

    function initHostDropdown() {
      const dropdown = document.getElementById('q-select-dropdown');
      dropdown.innerHTML = DEFAULT_QUESTIONS.map((q, idx) => `<option value="${idx}">第 ${idx+1} 題：${q.title.substring(0, 10)}...</option>`).join('');
    }

    // ================= 3. 即時資料監聽與畫面同步 =================
    function listenToDatabase() {
      db.ref('gameState').on('value', (snapshot) => {
        const data = snapshot.val() || {};

        document.getElementById('score-p1').innerText = data.p1Score || 0;
        document.getElementById('score-p2').innerText = data.p2Score || 0;

        const qIndex = data.currentQIndex || 0;
        const currentQ = DEFAULT_QUESTIONS[qIndex] || DEFAULT_QUESTIONS[0];

        const displayScore = data.tempScore !== undefined ? data.tempScore : currentQ.score;
        const displayTitle = data.tempTitle || currentQ.title;
        const displayMedia = data.tempMedia || currentQ.media;

        document.getElementById('q-score-display').innerText = displayScore;
        document.getElementById('q-number').innerText = `第 ${qIndex + 1} / ${DEFAULT_QUESTIONS.length} 題`;
        document.getElementById('q-title').innerText = displayTitle;

        const dropdown = document.getElementById('q-select-dropdown');
        if (dropdown) dropdown.value = qIndex;

        // 如果是主持人，自動把當前題目的數值填入主畫面的即時修改表單中
        if (myRole === 'host') {
          document.getElementById('edit-title').value = displayTitle;
          document.getElementById('edit-score').value = displayScore;
          document.getElementById('edit-media-url').value = data.tempMedia || currentQ.media || '';
          document.getElementById('edit-sound-correct').value = data.tempSoundCorrect || currentQ.soundCorrect || '';
          document.getElementById('edit-sound-wrong').value = data.tempSoundWrong || currentQ.soundWrong || '';
        }

        if (currentQ.bg) document.body.style.backgroundImage = `url('${currentQ.bg}')`;

        // 渲染多媒體
        const mediaBox = document.getElementById('media-container');
        if (displayMedia) {
          const url = displayMedia.toLowerCase();
          if (url.startsWith('data:video') || url.endsWith('.mp4') || url.endsWith('.webm') || url.includes('video')) {
            mediaBox.innerHTML = `<video src="${displayMedia}" controls autoplay loop muted></video>`;
          } else {
            mediaBox.innerHTML = `<img src="${displayMedia}" alt="題目媒體">`;
          }
        } else {
          mediaBox.innerHTML = `<div style="color:#666;">無多媒體檔案</div>`;
        }

        // 渲染選項
        const optsContainer = document.getElementById('options-container');
        const selectedOpt = data.selectedOption;
        optsContainer.innerHTML = (currentQ.options || []).map((opt, idx) => {
          const optKey = String.fromCharCode(65 + idx);
          const isSelected = selectedOpt === optKey ? 'selected' : '';
          return `<div class="option-item ${isSelected}" onclick="clickOption('${optKey}')">${opt}</div>`;
        }).join('');

        // 音效與搶答狀態
        const buzzerBtn = document.getElementById('buzzer-btn');
        const statusBox = document.getElementById('buzzer-status');

        if (data.lastAction === 'sound_correct') {
          const soundUrl = data.tempSoundCorrect || currentQ.soundCorrect;
          if (soundUrl) new Audio(soundUrl).play();
        } else if (data.lastAction === 'sound_wrong') {
          const soundUrl = data.tempSoundWrong || currentQ.soundWrong;
          if (soundUrl) new Audio(soundUrl).play();
        }

        if (data.winner) {
          const winnerName = data.winner === 'p1' ? '玩家一 (P1)' : '玩家二 (P2)';
          const chosenText = selectedOpt ? ` (已選擇選項 ${selectedOpt})` : '';
          statusBox.innerText = `🚨 ${winnerName} 搶答成功！${chosenText}`;
          if (buzzerBtn) buzzerBtn.disabled = true;
        } else if (data.buzzerActive) {
          statusBox.innerText = "⚡ 搶答開放中！快按搶答按鈕！";
          if (buzzerBtn) buzzerBtn.disabled = false;
        } else {
          statusBox.innerText = "🔒 等待主持人開放搶答...";
          if (buzzerBtn) buzzerBtn.disabled = true;
        }
      });
    }

    function clickOption(optKey) {
      db.ref('gameState').once('value', (snapshot) => {
        const data = snapshot.val() || {};
        if (data.winner === myRole || myRole === 'host') {
          db.ref('gameState/selectedOption').set(optKey);
        }
      });
    }

    function pressBuzzer() {
      soundBuzzer.play();
      db.ref('gameState').transaction((state) => {
        if (state && state.buzzerActive && !state.winner) {
          state.winner = myRole;
          state.buzzerActive = false;
        }
        return state;
      });
    }

    // ================= 4. 主持人控制邏輯 =================
    function judgeAnswer(isCorrect) {
      db.ref('gameState').once('value', (snapshot) => {
        const data = snapshot.val() || {};
        const winner = data.winner;
        if (!winner) return;

        const qIndex = data.currentQIndex || 0;
        const currentQ = DEFAULT_QUESTIONS[qIndex] || {};
        const scoreVal = data.tempScore !== undefined ? data.tempScore : currentQ.score;

        const delta = isCorrect ? scoreVal : -scoreVal;
        const currentScore = data[`${winner}Score`] || 0;

        db.ref('gameState').update({
          [`${winner}Score`]: currentScore + delta,
          lastAction: isCorrect ? 'sound_correct' : 'sound_wrong',
          buzzerActive: false,
          winner: null,
          selectedOption: null
        });

        setTimeout(() => db.ref('gameState/lastAction').set(''), 500);
      });
    }

    function jumpToQuestion(idx) {
      db.ref('gameState').update({
        currentQIndex: parseInt(idx),
        tempScore: null,
        tempTitle: null,
        tempMedia: null,
        tempSoundCorrect: null,
        tempSoundWrong: null,
        selectedOption: null,
        buzzerActive: false,
        winner: null
      });
    }

    function nextQuestion() {
      db.ref('gameState').once('value', (snapshot) => {
        const currentIdx = (snapshot.val() || {}).currentQIndex || 0;
        if (currentIdx < DEFAULT_QUESTIONS.length - 1) jumpToQuestion(currentIdx + 1);
      });
    }

    function prevQuestion() {
      db.ref('gameState').once('value', (snapshot) => {
        const currentIdx = (snapshot.val() || {}).currentQIndex || 0;
        if (currentIdx > 0) jumpToQuestion(currentIdx - 1);
      });
    }

    // 發布主畫面上的即時修改
    async function applyTempEdit() {
      const updates = {};
      const newTitle = document.getElementById('edit-title').value;
      const newScore = parseInt(document.getElementById('edit-score').value);

      if (newTitle) updates.tempTitle = newTitle;
      if (!isNaN(newScore)) updates.tempScore = newScore;

      const mediaFile = document.getElementById('edit-media-file').files[0];
      const mediaUrl = document.getElementById('edit-media-url').value;
      if (mediaFile) {
        updates.tempMedia = await fileToDataURL(mediaFile);
      } else if (mediaUrl) {
        updates.tempMedia = mediaUrl;
      }

      const correctFile = document.getElementById('edit-correct-file').files[0];
      const correctUrl = document.getElementById('edit-sound-correct').value;
      if (correctFile) {
        updates.tempSoundCorrect = await fileToDataURL(correctFile);
      } else if (correctUrl) {
        updates.tempSoundCorrect = correctUrl;
      }

      const wrongFile = document.getElementById('edit-wrong-file').files[0];
      const wrongUrl = document.getElementById('edit-sound-wrong').value;
      if (wrongFile) {
        updates.tempSoundWrong = await fileToDataURL(wrongFile);
      } else if (wrongUrl) {
        updates.tempSoundWrong = wrongUrl;
      }

      db.ref('gameState').update(updates);
      alert("✅ 已即時更新全場畫面設定！");
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function enableBuzzer() { db.ref('gameState').update({ buzzerActive: true, winner: null, selectedOption: null }); }
    function resetBuzzer() { db.ref('gameState').update({ buzzerActive: false, winner: null, selectedOption: null }); }
  </script>
</body>
</html>
