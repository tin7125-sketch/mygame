<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多媒體互動搶答系統</title>
  <style>
    :root {
      --bg-color: #0f1117;
      --panel-bg: rgba(22, 26, 36, 0.95);
      --accent-pink: #ff6b9d;
      --accent-blue: #4a90e2;
      --accent-yellow: #f5a623;
      --accent-green: #2ecc71;
      --accent-red: #e74c3c;
      --text-main: #ffffff;
      --border-color: rgba(255, 255, 255, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    body {
      font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-color);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      transition: background 0.5s ease;
    }

    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 15px; position: relative; padding-bottom: 80px; }
    .card { background: var(--panel-bg); border-radius: 16px; padding: 20px; border: 1px solid var(--border-color); text-align: center; backdrop-filter: blur(10px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .title { font-size: 26px; font-weight: bold; margin-bottom: 15px; color: var(--accent-pink); }
    
    .btn { background: var(--accent-blue); border: none; color: white; padding: 10px 18px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 4px; font-weight: bold; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-danger { background: var(--accent-red); }
    .btn-success { background: var(--accent-green); }
    .btn-warning { background: var(--accent-yellow); color: #111; }
    
    .scores { display: flex; justify-content: space-around; font-size: 22px; font-weight: bold; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
    .q-progress { color: var(--accent-yellow); font-size: 18px; font-weight: bold; margin-bottom: 5px; }
    .question-text { font-size: 24px; font-weight: bold; margin: 10px 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    /* 影片/圖片大畫面區 */
    .media-box { width: 100%; height: 360px; background: #000; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin: 12px 0; overflow: hidden; border: 1px solid var(--border-color); }
    .media-box img, .media-box video { width: 100%; height: 100%; object-fit: contain; }

    /* 可點擊選項清單 */
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
    .option-item { 
      background: rgba(255,255,255,0.08); 
      padding: 14px; 
      border-radius: 10px; 
      border: 2px solid var(--border-color); 
      text-align: left; 
      font-size: 18px; 
      font-weight: bold; 
      cursor: pointer;
      transition: 0.2s; 
    }
    .option-item:hover { background: rgba(255,255,255,0.18); border-color: var(--accent-blue); }
    .option-item.selected { background: var(--accent-blue); border-color: #fff; color: #fff; box-shadow: 0 0 12px rgba(74, 144, 226, 0.8); }

    .status-msg { font-size: 24px; color: var(--accent-yellow); font-weight: bold; margin: 10px 0; min-height: 36px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

    /* 搶答按鈕 */
    .btn-buzzer { width: 100%; height: 130px; font-size: 36px; font-weight: bold; background: var(--accent-pink); border-radius: 20px; box-shadow: 0 8px 0 #c0392b; cursor: pointer; color: white; border: none; }
    .btn-buzzer:active { transform: translateY(4px); box-shadow: 0 4px 0 #c0392b; }
    .btn-buzzer:disabled { background: #444; box-shadow: none; color: #888; }

    /* 👑 主持人專屬：直接顯示在主畫面上的題庫與即時修改面板 */
    .host-direct-panel {
      background: rgba(245, 166, 35, 0.1);
      border: 2px dashed var(--accent-yellow);
      border-radius: 12px;
      padding: 15px;
      margin-top: 15px;
      text-align: left;
      display: none;
    }
    .host-direct-title { font-size: 16px; font-weight: bold; color: var(--accent-yellow); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .form-input-sm { width: 100%; padding: 6px; font-size: 12px; border-radius: 4px; border: 1px solid #555; background: #222; color: #fff; margin-bottom: 6px; user-select: text; }
    .form-label { font-size: 11px; color: #ccc; display: block; margin-top: 4px; }

    /* 👑 右下角主持快捷控制台 */
    .host-floating-panel {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
      background: rgba(15, 17, 23, 0.95);
      border: 2px solid var(--accent-yellow);
      border-radius: 12px;
      padding: 12px;
      width: 280px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      display: none;
    }

    .room-bar { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; margin:10px 0; }
    .room-code { font-size:20px; font-weight:bold; letter-spacing:2px; color:var(--accent-yellow); }
    .timer { font-size:56px; font-weight:900; color:var(--accent-yellow); min-height:70px; text-shadow:0 2px 10px rgba(245,166,35,.35); }
    .timer.danger { color:var(--accent-red); animation:pulse .6s infinite alternate; }
    .player-list { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
    .player-chip { padding:8px; border:1px solid var(--border-color); border-radius:8px; background:rgba(255,255,255,.05); }
    .player-chip.connected { border-color:var(--accent-green); }
    .answer-lock { opacity:.55; pointer-events:none; }
    .result-banner { padding:12px; border-radius:10px; margin:10px 0; font-weight:bold; background:rgba(46,204,113,.12); border:1px solid var(--accent-green); }
    .host-floating-panel .btn { margin:0; }
    @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.06); } }
    @media (max-width: 600px) {
      body { padding:10px; }
      .container { padding-bottom:120px; }
      .media-box { height:240px; }
      .options-grid { grid-template-columns:1fr; gap:8px; }
      .option-item { font-size:19px; padding:16px; }
      .btn-buzzer { height:180px; font-size:42px; }
      .scores { font-size:17px; }
      .question-text { font-size:21px; }
      .host-floating-panel { left:10px; right:10px; bottom:10px; width:auto; }
      .player-list { grid-template-columns:1fr; }
    }
    .host-floating-header { font-weight: bold; color: var(--accent-yellow); margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; font-size: 13px; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="container">
    <!-- 1. 角色選擇頁面 -->
    <div id="role-select" class="card">
      <div class="title">🎮 多媒體互動搶答系統</div>
      <div class="room-bar">
        <span>房間：</span><span id="room-code-display" class="room-code">未建立</span>
      </div>
      <button class="btn btn-warning" onclick="selectRole('host')">👑 我是 主持人</button>
      <button class="btn" onclick="selectRole('p1')">🙋‍♂️ 玩家加入遊戲</button>
      <button class="btn" 

      <div id="join-panel" style="display:none; margin-top:15px; padding:15px; background:rgba(255,255,255,0.06); border:1px solid var(--border-color); border-radius:10px;">
        <div style="font-weight:bold; margin-bottom:8px;">🎮 加入遊戲</div>
        <input id="room-code-input" type="text" maxlength="8" placeholder="輸入主持人提供的房間代碼"
               style="width:100%; padding:10px; border-radius:8px; border:1px solid #555; background:#222; color:#fff; font-size:16px; user-select:text; text-transform:uppercase;">
        <input id="player-name-input" type="text" maxlength="20" placeholder="輸入你的玩家名稱"
               style="width:100%; margin-top:8px; padding:10px; border-radius:8px; border:1px solid #555; background:#222; color:#fff; font-size:16px; user-select:text;">
        <button class="btn btn-success" style="width:100%; margin-top:8px;" onclick="confirmPlayerJoin()">✅ 加入遊戲</button>
      </div>
    </div>

    <!-- 2. 主遊戲畫面 -->
    <div id="game-panel" class="card" style="display: none;">
      <div id="role-display" style="color: #aaa; font-size: 14px; margin-bottom: 8px;"></div>
      <div class="room-bar">
        <span>房間：</span><span id="game-room-code" class="room-code">--</span>
      </div>
      <div id="player-list" class="player-list"></div>
      
      <!-- 分數統計區 -->
      <div class="scores">
        <div><span id="name-p1">玩家一</span>：<span id="score-p1" style="color:var(--accent-pink)">0</span></div>
        <div><span id="name-p2">玩家二</span>：<span id="score-p2" style="color:var(--accent-blue)">0</span></div>
      </div>

      <!-- 題目與價值 -->
      <div style="margin-top: 15px;">
        <div class="q-progress">
          <span id="q-number">題目載入中...</span>
          <span style="color: var(--accent-green); margin-left: 10px;">[ 本題價值：<span id="q-score-display">10</span> 分 ]</span>
        </div>
        <div class="question-text" id="q-title">--</div>
      </div>

      <!-- 高畫質多媒體區域 -->
      <div class="media-box" id="media-container"></div>

      <!-- 選項清單區 -->
      <div class="options-grid" id="options-container"></div>

      <!-- 👑 【主持人專屬】直接顯示在主畫面上的題庫與題目編輯管理面板 -->
      <div id="host-direct-panel" class="host-direct-panel">
        <div class="host-direct-title">
          <span>🛠️ 題庫與背景設定管理 (選手看不見)</span>
          <div>
            <button class="btn btn-success" style="padding:4px 10px; font-size:11px;" onclick="addNewQuestion()">➕ 新增一題</button>
            <button class="btn btn-danger" style="padding:4px 10px; font-size:11px;" onclick="deleteCurrentQuestion()">🗑️ 刪除本題</button>
          </div>
        </div>

        <div style="margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 6px;">
          <label class="form-label" style="color:var(--accent-yellow);">快速選擇跳到某題：</label>
          <select id="direct-q-select" class="form-input-sm" onchange="jumpToQuestion(this.value)"></select>
        </div>
        
        <label class="form-label">修改題目文字：</label>
        <input type="text" id="edit-title" class="form-input-sm">

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">上傳題目照片/影片：</label>
            <input type="file" id="edit-media-file" class="form-input-sm" accept="image/*,video/*">
          </div>
          <div>
            <label class="form-label">或貼上題目媒體網址：</label>
            <input type="text" id="edit-media-url" class="form-input-sm" placeholder="https://...">
          </div>
        </div>

        <!-- 🌟 自動背景設定區塊 -->
        <div style="background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; margin: 6px 0; border: 1px dashed var(--accent-blue);">
          <label class="form-label" style="color: var(--accent-blue); font-weight: bold;">🖼️ 自動更換背景圖片設定：</label>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
            <div>
              <label class="form-label">上傳背景圖片檔案：</label>
              <input type="file" id="edit-bg-file" class="form-input-sm" accept="image/*">
            </div>
            <div>
              <label class="form-label">或貼上背景圖片網址：</label>
              <input type="text" id="edit-bg-url" class="form-input-sm" placeholder="https://...">
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">選項 A：</label>
            <input type="text" id="edit-opt-0" class="form-input-sm">
            <label class="form-label">選項 B：</label>
            <input type="text" id="edit-opt-1" class="form-input-sm">
          </div>
          <div>
            <label class="form-label">選項 C：</label>
            <input type="text" id="edit-opt-2" class="form-input-sm">
            <label class="form-label">選項 D：</label>
            <input type="text" id="edit-opt-3" class="form-input-sm">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">正確答案 (A/B/C/D)：</label>
            <select id="edit-answer" class="form-input-sm">
              <option value="A">A</option>
              <option value="B">B</option>
              <option value="C">C</option>
              <option value="D">D</option>
            </select>
          </div>
          <div>
            <label class="form-label">本題配分：</label>
            <input type="number" id="edit-score" class="form-input-sm">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="form-label">答對音效網址：</label>
            <input type="text" id="edit-sound-correct" class="form-input-sm" placeholder="https://...">
          </div>
          <div>
            <label class="form-label">答錯音效網址：</label>
            <input type="text" id="edit-sound-wrong" class="form-input-sm" placeholder="https://...">
          </div>
        </div>

        <button class="btn btn-success" style="width:100%; margin-top:8px; font-size:13px;" onclick="applyTempEdit()">🚀 即時儲存並同步更新全場 (含背景)</button>

        <div style="margin-top:10px; padding:8px 0; border-bottom:1px dashed #555;">
          <label class="form-label" style="color:var(--accent-yellow);">🎮 遊戲房間</label>
          <div class="room-bar" style="justify-content:flex-start;">
            <span>房間代碼：</span><span id="host-room-code" class="room-code">--</span>
          </div>
          <button class="btn btn-success" style="width:100%; font-size:12px;" onclick="startGame()">▶️ 開始／重新開始遊戲</button>
        </div>

        <div style="margin-top:10px; padding-top:8px; border-top:1px dashed #555;">
          <label class="form-label" style="color:var(--accent-yellow);">👤 自訂玩家名稱（主持人可直接修改）</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
            <input type="text" id="host-name-p1" class="form-input-sm" maxlength="20" placeholder="玩家一名稱">
            <input type="text" id="host-name-p2" class="form-input-sm" maxlength="20" placeholder="玩家二名稱">
          </div>
          <button class="btn btn-warning" style="width:100%; margin-top:4px; font-size:12px;" onclick="savePlayerNames()">💾 儲存玩家名稱</button>
        </div>
      </div>

      <!-- 搶答動態訊息 -->
      <div id="timer" class="timer"></div>
      <div class="status-msg" id="buzzer-status">等待主持人開放搶答...</div>
      <div id="result-banner" class="result-banner" style="display:none;"></div>

      <!-- 選手搶答按鈕 -->
      <div id="player-controls" style="display: none;">
        <button id="buzzer-btn" class="btn-buzzer" onclick="pressBuzzer()" disabled>⚡ 搶 答 ⚡</button>
      </div>
    </div>
  </div>

  <!-- 3. 👑 右下角主持快捷控制台 -->
  <div id="host-floating" class="host-floating-panel">
    <div class="host-floating-header">⚡ 搶答與判定快捷列</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; gap: 4px;">
        <button class="btn btn-warning" style="flex:1; padding:6px; font-size:12px;" onclick="prevQuestion()">⬅️ 上題</button>
        <button class="btn btn-warning" style="flex:1; padding:6px; font-size:12px;" onclick="nextQuestion()">下題 ➡️</button>
      </div>
      <div style="display: flex; gap: 4px;">
        <button class="btn btn-success" style="flex:1; padding:6px; font-size:12px;" onclick="enableBuzzer()">⚡ 開放</button>
        <button class="btn btn-danger" style="flex:1; padding:6px; font-size:12px;" onclick="resetBuzzer()">🔄 重置</button>
      </div>
      <div style="border-top:1px dashed #555; padding-top:4px; display: flex; gap: 4px;">
        <button class="btn btn-success" style="flex:1; padding:6px; font-size:12px;" onclick="judgeAnswer(true)">⭕ 答對</button>
        <button class="btn btn-danger" style="flex:1; padding:6px; font-size:12px;" onclick="judgeAnswer(false)">❌ 答錯</button>
      </div>
    </div>
  </div>

  <script>
    // ================= 1. 預設題庫 =================
    let defaultQuestions = [
      {
        id: 1,
        title: "請問這隻可愛的狗是什麼品種？",
        media: "https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=800",
        bg: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200",
        options: ["柴犬", "柯基", "哈士奇", "貴賓狗"],
        answer: "A",
        score: 10,
        soundCorrect: "https://actions.google.com/sounds/v1/cartoon/clown_horn.ogg",
        soundWrong: "https://actions.google.com/sounds/v1/cartoon/boing.ogg"
      },
      {
        id: 2,
        title: "請問短片中的風景是哪一個國家？",
        media: "https://www.w3schools.com/html/mov_bbb.mp4",
        bg: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1200",
        options: ["日本", "美國", "瑞士", "紐西蘭"],
        answer: "C",
        score: 20,
        soundCorrect: "https://actions.google.com/sounds/v1/cheering/applause.ogg",
        soundWrong: "https://actions.google.com/sounds/v1/fights/hit_01.ogg"
      }
    ];

    const soundBuzzer = new Audio("https://actions.google.com/sounds/v1/emergency/beeps_high.ogg");

    // ================= 2. Firebase 初始化 =================
    const firebaseConfig = {
      apiKey: "AIzaSyC3ogiRnUkzdvHLQvZABgfDtTmacyzX6nw",
      authDomain: "my-game-d36e6.firebaseapp.com",
      databaseURL: "https://my-game-d36e6-default-rtdb.firebaseio.com",
      projectId: "my-game-d36e6",
      storageBucket: "my-game-d36e6.firebasestorage.app",
      messagingSenderId: "1042585493952",
      appId: "1:1042585493952:web:f5927600bc64b0f77b2825",
      measurementId: "G-2FRXMEDR08"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let myRole = '';
    let myPlayerId = '';
    let myRoomCode = '';
    let pendingJoin = false;
    let countdownTimer = null;
    let lastPlayedActionId = null;

    function selectRole(role) {
      if (role === 'host') {
        createHostRoom();
      } else {
        // 玩家不再手動指定 P1/P2，由房間自動分配空缺的位置。
        joinPlayer();
      }
    }

    function randomCode(length = 6) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < length; i++) out += chars[Math.floor(Math.random() * chars.length)];
      return out;
    }

    function getStoredPlayerId() {
      let id = localStorage.getItem('quizPlayerId');
      if (!id) {
        id = 'player_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        localStorage.setItem('quizPlayerId', id);
      }
      return id;
    }

    function createHostRoom() {
      myRole = 'host';
      myRoomCode = randomCode();
      const initialState = {
        roomCode: myRoomCode,
        hostId: 'host_' + Date.now(),
        gameStatus: 'waiting',
        currentQIndex: 0,
        p1Score: 0,
        p2Score: 0,
        playerNames: { p1: '玩家一', p2: '玩家二' },
        players: {},
        questionsList: defaultQuestions,
        buzzerActive: false,
        winner: null,
        selectedOption: null,
        blockedPlayers: {},
        lastAction: '',
        timerEndsAt: null
      };

      db.ref('rooms/' + myRoomCode + '/gameState').set(initialState)
        .then(() => enterGameAsRole('host'))
        .catch(err => {
          console.error(err);
          alert('❌ 房間建立失敗：' + (err.message || err));
          myRole = '';
          myRoomCode = '';
        });
    }

    function joinPlayer() {
      document.getElementById('join-panel').style.display = 'block';
      document.getElementById('room-code-input').focus();
    }

    async function confirmPlayerJoin() {
      const room = document.getElementById('room-code-input').value.trim().toUpperCase();
      const name = document.getElementById('player-name-input').value.trim().slice(0, 20);
      if (!room || !name) {
        alert('⚠️ 請輸入房間代碼與玩家名稱！');
        return;
      }

      const snap = await db.ref('rooms/' + room + '/gameState').once('value');
      if (!snap.exists()) {
        alert('❌ 找不到這個房間，請確認代碼。');
        return;
      }

      const state = snap.val() || {};
      const playerId = getStoredPlayerId();
      let role = null;

      if (state.players && state.players[playerId]) {
        role = state.players[playerId].role;
      } else {
        const occupied = Object.values(state.players || {}).map(p => p.role);
        if (!occupied.includes('p1')) role = 'p1';
        else if (!occupied.includes('p2')) role = 'p2';
        else {
          alert('❌ 這個房間的兩個玩家位置都已經有人使用。');
          return;
        }
      }

      myPlayerId = playerId;
      myRoomCode = room;
      myRole = role;

      await db.ref('rooms/' + room + '/gameState/players/' + playerId).set({
        role, name, joinedAt: firebase.database.ServerValue.TIMESTAMP
      });
      await db.ref('rooms/' + room + '/gameState/playerNames/' + role).set(name);

      enterGameAsRole(role, name);
    }

    function enterGameAsRole(role, playerName = '') {
      myRole = role;
      document.getElementById('role-select').style.display = 'none';
      document.getElementById('join-panel').style.display = 'none';
      document.getElementById('game-panel').style.display = 'block';

      document.getElementById('game-room-code').innerText = myRoomCode || '--';
      if (role === 'host') {
        document.getElementById('role-display').innerText = "當前身份：👑 主持人控制台";
        document.getElementById('host-direct-panel').style.display = 'block';
        document.getElementById('host-floating').style.display = 'block';
        document.getElementById('host-room-code').innerText = myRoomCode;
      } else {
        document.getElementById('role-display').innerText =
          `當前身份：${role === 'p1' ? '🙋‍♂️' : '🙋‍♀️'} ${playerName} (${role.toUpperCase()})`;
        document.getElementById('player-controls').style.display = 'block';
      }

      listenToDatabase();
    }

    function gameRef(path = '') {
      if (!myRoomCode) return null;
      return db.ref('rooms/' + myRoomCode + '/gameState' + (path ? '/' + path : ''));
    }

    function updateHostDropdown(totalCount, currentIdx) {
      const dropdown = document.getElementById('direct-q-select');
      if (!dropdown) return;
      dropdown.innerHTML = '';
      for (let i = 0; i < totalCount; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `第 ${i + 1} 題`;
        if (i === currentIdx) opt.selected = true;
        dropdown.appendChild(opt);
      }
    }

    // ================= 3. 即時資料監聽與畫面同步 =================
    function listenToDatabase() {
      const ref = gameRef();
      if (!ref) return;
      ref.off('value');
      ref.on('value', (snapshot) => {
        const data = snapshot.val() || {};
        
        if (data.questionsList && Array.isArray(data.questionsList)) {
          defaultQuestions = data.questionsList;
        }

        const playerNames = data.playerNames || {};
        const player1Name = playerNames.p1 || '玩家一';
        const player2Name = playerNames.p2 || '玩家二';

        document.getElementById('game-room-code').innerText = data.roomCode || myRoomCode || '--';
        if (myRole === 'host') document.getElementById('host-room-code').innerText = data.roomCode || myRoomCode || '--';

        const players = data.players || {};
        const p1Connected = Object.values(players).some(p => p.role === 'p1');
        const p2Connected = Object.values(players).some(p => p.role === 'p2');
        document.getElementById('player-list').innerHTML =
          `<div class="player-chip ${p1Connected ? 'connected' : ''}">🟢 ${player1Name} <small>(P1 ${p1Connected ? '已加入' : '等待中'})</small></div>` +
          `<div class="player-chip ${p2Connected ? 'connected' : ''}">🔵 ${player2Name} <small>(P2 ${p2Connected ? '已加入' : '等待中'})</small></div>`;

        updateTimer(data.timerEndsAt || null, data.gameStatus);

        document.getElementById('name-p1').innerText = player1Name;
        document.getElementById('name-p2').innerText = player2Name;
        document.getElementById('score-p1').innerText = data.p1Score || 0;
        document.getElementById('score-p2').innerText = data.p2Score || 0;

        const qIndex = data.currentQIndex || 0;
        const currentQ = defaultQuestions[qIndex] || defaultQuestions[0] || {
          title: "請新增題目", media: "", bg: "", options: ["A", "B", "C", "D"], answer: "A", score: 10
        };

        updateHostDropdown(defaultQuestions.length, qIndex);

        document.getElementById('q-score-display').innerText = currentQ.score;
        document.getElementById('q-number').innerText = `第 ${qIndex + 1} / ${defaultQuestions.length} 題`;
        document.getElementById('q-title').innerText = currentQ.title;

        // 自動更換背景圖片
        if (currentQ.bg) {
          document.body.style.backgroundImage = `url('${currentQ.bg}')`;
        } else {
          document.body.style.backgroundImage = 'none';
        }

        // 如果是主持人，自動把當前題目帶入修改表單
        if (myRole === 'host') {
          document.getElementById('host-name-p1').value = player1Name;
          document.getElementById('host-name-p2').value = player2Name;

          document.getElementById('edit-title').value = currentQ.title || '';
          document.getElementById('edit-score').value = currentQ.score || 10;
          document.getElementById('edit-media-url').value = currentQ.media || '';
          document.getElementById('edit-bg-url').value = currentQ.bg || '';
          document.getElementById('edit-answer').value = currentQ.answer || 'A';
          document.getElementById('edit-sound-correct').value = currentQ.soundCorrect || '';
          document.getElementById('edit-sound-wrong').value = currentQ.soundWrong || '';

          const opts = currentQ.options || ["", "", "", ""];
          for (let i = 0; i < 4; i++) {
            document.getElementById(`edit-opt-${i}`).value = opts[i] || '';
          }
        }

        // 渲染多媒體
        const mediaBox = document.getElementById('media-container');
        if (currentQ.media) {
          const url = currentQ.media.toLowerCase();
          if (url.startsWith('data:video') || url.endsWith('.mp4') || url.endsWith('.webm') || url.includes('video')) {
            mediaBox.innerHTML = `<video src="${currentQ.media}" controls autoplay loop muted></video>`;
          } else {
            mediaBox.innerHTML = `<img src="${currentQ.media}" alt="題目媒體">`;
          }
        } else {
          mediaBox.innerHTML = `<div style="color:#666;">無多媒體檔案</div>`;
        }

        // 渲染選項
        const optsContainer = document.getElementById('options-container');
        const selectedOpt = data.selectedOption;
        optsContainer.innerHTML = (currentQ.options || []).map((opt, idx) => {
          const optKey = String.fromCharCode(65 + idx);
          const cleanOpt = String(opt).replace(/^[A-D][.、]\s*/i, '');
          const isSelected = selectedOpt === optKey ? 'selected' : '';
          const canAnswer = myRole === 'host' || data.winner === myRole;
          const lockClass = canAnswer ? '' : 'answer-lock';
          return `<div class="option-item ${isSelected} ${lockClass}" onclick="clickOption('${optKey}')"><strong>${optKey}.</strong> ${cleanOpt}</div>`;
        }).join('');

        // 音效與搶答狀態
        const buzzerBtn = document.getElementById('buzzer-btn');
        const statusBox = document.getElementById('buzzer-status');

        const action = data.lastAction;
        if (action && action.id && action.id !== lastPlayedActionId) {
          if (action.type === 'correct' && currentQ.soundCorrect) new Audio(currentQ.soundCorrect).play().catch(() => {});
          if (action.type === 'wrong' && currentQ.soundWrong) new Audio(currentQ.soundWrong).play().catch(() => {});
          lastPlayedActionId = action.id;
        }

        if (data.winner) {
          const winnerName = data.winner === 'p1' ? `${player1Name} (P1)` : `${player2Name} (P2)`;
          const chosenText = selectedOpt ? `（已選擇 ${selectedOpt}）` : '';
          statusBox.innerText = `🚨 ${winnerName} 搶答成功！${chosenText}`;
          if (buzzerBtn) buzzerBtn.disabled = true;
        } else if (data.gameStatus === 'finished') {
          statusBox.innerText = '🏁 遊戲結束';
          if (buzzerBtn) buzzerBtn.disabled = true;
        } else if (data.buzzerActive) {
          statusBox.innerText = "⚡ 搶答開放中！";
          if (buzzerBtn) buzzerBtn.disabled = !!(data.blockedPlayers && data.blockedPlayers[myRole]);
        } else {
          statusBox.innerText = data.gameStatus === 'waiting' ? "⏳ 等待主持人開始遊戲..." : "🔒 等待主持人開放搶答...";
          if (buzzerBtn) buzzerBtn.disabled = true;
        }
      });
    }

    function clickOption(optKey) {
      gameRef().once('value', (snapshot) => {
        const data = snapshot.val() || {};
        if (data.winner === myRole || myRole === 'host') {
          gameRef('selectedOption').set(optKey);
        }
      });
    }

    function pressBuzzer() {
      if (!myRole || myRole === 'host') return;
      soundBuzzer.currentTime = 0;
      soundBuzzer.play().catch(() => {});

      gameRef().transaction((state) => {
        if (state && state.buzzerActive && !state.winner &&
            !(state.blockedPlayers && state.blockedPlayers[myRole])) {
          state.winner = myRole;
          state.buzzerActive = false;
          state.gameStatus = 'answering';
          state.timerEndsAt = null;
        }
        return state;
      });
    }

    function updateTimer(endsAt, status) {
      clearInterval(countdownTimer);
      const timer = document.getElementById('timer');
      if (!endsAt || status !== 'buzzer') {
        timer.innerText = '';
        timer.classList.remove('danger');
        return;
      }

      const tick = () => {
        const remain = Math.max(0, Math.ceil((endsAt - Date.now()) / 1000));
        timer.innerText = remain;
        timer.classList.toggle('danger', remain <= 3);

        if (remain <= 0) {
          clearInterval(countdownTimer);
          if (myRole === 'host') {
            gameRef().once('value', snap => {
              const data = snap.val() || {};
              if (data.buzzerActive && !data.winner) {
                gameRef().update({
                  buzzerActive: false,
                  gameStatus: 'question',
                  timerEndsAt: null
                });
              }
            });
          }
        }
      };
      tick();
      countdownTimer = setInterval(tick, 250);
    }

    // ================= 4. 主持人管理邏輯 =================
    function judgeAnswer(isCorrect) {
      if (myRole !== 'host') return;
      gameRef().once('value', (snapshot) => {
        const data = snapshot.val() || {};
        const winner = data.winner;
        if (!winner) return;

        const qIndex = data.currentQIndex || 0;
        const syncedQuestions = Array.isArray(data.questionsList) ? data.questionsList : defaultQuestions;
        const currentQ = syncedQuestions[qIndex] || {};
        const scoreVal = Number(currentQ.score) || 10;
        const delta = isCorrect ? scoreVal : -scoreVal;
        const currentScore = Number(data[`${winner}Score`]) || 0;

        const updates = {
          [`${winner}Score`]: currentScore + delta,
          lastAction: { type: isCorrect ? 'correct' : 'wrong', id: Date.now() },
          selectedOption: null,
          winner: null
        };

        if (isCorrect) {
          updates.buzzerActive = false;
          updates.gameStatus = 'result';
          updates.blockedPlayers = {};
        } else {
          const blocked = Object.assign({}, data.blockedPlayers || {});
          blocked[winner] = true;
          const otherRole = winner === 'p1' ? 'p2' : 'p1';
          const otherBlocked = !!blocked[otherRole];

          updates.blockedPlayers = blocked;
          updates.buzzerActive = !otherBlocked;
          updates.gameStatus = otherBlocked ? 'result' : 'buzzer';
          updates.timerEndsAt = otherBlocked ? null : Date.now() + 10000;
        }

        gameRef().update(updates).then(() => {
          const banner = document.getElementById('result-banner');
          banner.style.display = 'block';
          banner.innerText = isCorrect
            ? `⭕ ${winner === 'p1' ? (data.playerNames?.p1 || '玩家一') : (data.playerNames?.p2 || '玩家二')} 答對！ +${scoreVal} 分`
            : `❌ 答錯！${winner === 'p1' ? (data.playerNames?.p1 || '玩家一') : (data.playerNames?.p2 || '玩家二')} 本題不能再次搶答。`;
          setTimeout(() => banner.style.display = 'none', 2500);
        });
      });
    }

    function jumpToQuestion(idx) {
      gameRef().update({
        currentQIndex: parseInt(idx),
        selectedOption: null,
        buzzerActive: false,
        winner: null,
        blockedPlayers: {},
        gameStatus: 'question',
        timerEndsAt: null
      });
    }

    function nextQuestion() {
      gameRef().once('value', (snapshot) => {
        const currentIdx = (snapshot.val() || {}).currentQIndex || 0;
        if (currentIdx < defaultQuestions.length - 1) jumpToQuestion(currentIdx + 1);
      });
    }

    function prevQuestion() {
      gameRef().once('value', (snapshot) => {
        const currentIdx = (snapshot.val() || {}).currentQIndex || 0;
        if (currentIdx > 0) jumpToQuestion(currentIdx - 1);
      });
    }

    function addNewQuestion() {
      if (myRole !== 'host') return;
      const newQ = {
        title: "請輸入新題目內容",
        media: "",
        bg: "",
        options: ["選項一", "選項二", "選項三", "選項四"],
        answer: "A",
        score: 10,
        soundCorrect: "",
        soundWrong: ""
      };
      defaultQuestions.push(newQ);
      gameRef().update({
        questionsList: defaultQuestions,
        currentQIndex: defaultQuestions.length - 1,
        selectedOption: null,
        buzzerActive: false,
        winner: null
      });
    }

    function deleteCurrentQuestion() {
      if (myRole !== 'host') return;
      if (defaultQuestions.length <= 1) {
        alert("⚠️ 題庫至少需要保留一題！");
        return;
      }
      gameRef().once('value', async (snapshot) => {
        const data = snapshot.val() || {};
        let currentIdx = data.currentQIndex || 0;
        
        defaultQuestions.splice(currentIdx, 1);
        if (currentIdx >= defaultQuestions.length) {
          currentIdx = defaultQuestions.length - 1;
        }

        await gameRef().update({
          questionsList: defaultQuestions,
          currentQIndex: currentIdx,
          selectedOption: null,
          buzzerActive: false,
          winner: null
        });
        alert("🗑️ 已刪除本題！");
      });
    }

    // 儲存並發布當前題目的修改 (包含背景)
    async function applyTempEdit() {
      if (myRole !== 'host') return;
      gameRef().once('value', async (snapshot) => {
        const data = snapshot.val() || {};
        const qIndex = data.currentQIndex || 0;

        const title = document.getElementById('edit-title').value;
        const score = parseInt(document.getElementById('edit-score').value) || 10;
        const answer = document.getElementById('edit-answer').value;
        const soundCorrect = document.getElementById('edit-sound-correct').value;
        const soundWrong = document.getElementById('edit-sound-wrong').value;

        const options = [
          document.getElementById('edit-opt-0').value,
          document.getElementById('edit-opt-1').value,
          document.getElementById('edit-opt-2').value,
          document.getElementById('edit-opt-3').value
        ];

        let media = document.getElementById('edit-media-url').value;
        const mediaFile = document.getElementById('edit-media-file').files[0];
        if (mediaFile) {
          media = await fileToDataURL(mediaFile);
        }

        let bg = document.getElementById('edit-bg-url').value;
        const bgFile = document.getElementById('edit-bg-file').files[0];
        if (bgFile) {
          bg = await fileToDataURL(bgFile);
        }

        if (!defaultQuestions[qIndex]) defaultQuestions[qIndex] = {};
        defaultQuestions[qIndex].title = title;
        defaultQuestions[qIndex].score = score;
        defaultQuestions[qIndex].answer = answer;
        defaultQuestions[qIndex].options = options;
        defaultQuestions[qIndex].media = media;
        defaultQuestions[qIndex].bg = bg;
        defaultQuestions[qIndex].soundCorrect = soundCorrect;
        defaultQuestions[qIndex].soundWrong = soundWrong;

        gameRef().update({
          questionsList: defaultQuestions
        });

        alert("✅ 題庫與背景設定已成功儲存並同步至全場！");
      });
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function savePlayerNames() {
      const p1 = document.getElementById('host-name-p1').value.trim().slice(0, 20) || '玩家一';
      const p2 = document.getElementById('host-name-p2').value.trim().slice(0, 20) || '玩家二';

      gameRef('playerNames').set({ p1, p2 })
        .then(() => alert('✅ 玩家名稱已同步到全場！'))
        .catch(err => alert('❌ 玩家名稱儲存失敗：' + err.message));
    }

    function startGame() {
      if (myRole !== 'host') return;
      gameRef().update({
        gameStatus: 'question',
        currentQIndex: 0,
        p1Score: 0,
        p2Score: 0,
        winner: null,
        selectedOption: null,
        blockedPlayers: {},
        buzzerActive: false,
        timerEndsAt: null
      });
    }

    function enableBuzzer() {
      if (myRole !== 'host') return;
      gameRef().update({
        buzzerActive: true,
        winner: null,
        selectedOption: null,
        blockedPlayers: {},
        gameStatus: 'buzzer',
        timerEndsAt: Date.now() + 10000
      });
    }
    function resetBuzzer() {
      if (myRole !== 'host') return;
      gameRef().update({
        buzzerActive: false,
        winner: null,
        selectedOption: null,
        blockedPlayers: {},
        gameStatus: 'question',
        timerEndsAt: null
      });
    }
  </script>
</body>
</html>
